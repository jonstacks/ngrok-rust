on:
  push:
    branches: [main]

name: Publish Docs

jobs:
  build:
    name: Build Rustdocs
    if: github.repository == 'ngrok/ngrok-rust'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: update apt
        run: sudo apt-get update
      - name: install protoc
        run: sudo apt-get -o Acquire::Retries=3 install -y protobuf-compiler
      - run: cargo doc --no-deps

      - name: Archive docs
        shell: sh
        run: |
          echo "<meta http-equiv=\"refresh\" content=\"0; url=ngrok\">" > target/doc/index.html
          chmod -c -R +r target/doc | while read line; do
            echo "::warning title=Changed permissions on a file::$line"
          done

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

    # Deployment job
  deploy:
    if: github.repository == 'ngrok/ngrok-rust'
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
